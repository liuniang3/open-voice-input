name: Build Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.85.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/audio-capture-helper

      - name: Install dependencies
        run: npm ci

      - name: Build installer and portable app
        run: npm run dist

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: open-voice-input-windows
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
            dist/SHA256SUMS.txt
          body_path: docs/releases/${{ github.ref_name }}.md

  build-macos:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    env:
      OVI_TARGET_ARCH: ${{ matrix.arch }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: ${{ matrix.arch }}
          cache: npm
      - run: npm ci
      - name: Build and test unsigned macOS distribution
        run: npm run dist:mac
      - name: Keep architecture update channels separate
        run: mv dist/latest-mac.yml dist/latest-${{ matrix.arch }}-mac.yml
      - name: Keep platform checksums separate
        run: cp dist/SHA256SUMS.txt dist/macOS-${{ matrix.arch }}-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: open-voice-input-macos-${{ matrix.arch }}-unsigned
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.zip.blockmap
            dist/latest-*-mac.yml
            dist/macOS-*-SHA256SUMS.txt
      - name: Publish unsigned macOS assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.zip.blockmap
            dist/latest-*-mac.yml
            dist/macOS-*-SHA256SUMS.txt
          body_path: docs/releases/${{ github.ref_name }}.md

  publish-release:
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Verify all desktop assets exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets > release-assets.json
          node <<'NODE'
          const fs = require("node:fs");
          const version = process.env.GITHUB_REF_NAME.replace(/^v/, "");
          const names = new Set(JSON.parse(fs.readFileSync("release-assets.json", "utf8")).assets.map(asset => asset.name));
          const expected = [
            `Open-Voice-Input-Setup-${version}-x64.exe`,
            `Open-Voice-Input-Setup-${version}-x64.exe.blockmap`,
            `Open-Voice-Input-Portable-${version}-x64.exe`,
            "latest.yml", "SHA256SUMS.txt",
            ...["x64", "arm64"].flatMap(arch => [
              `Open-Voice-Input-macOS-${version}-${arch}.dmg`,
              `Open-Voice-Input-macOS-${version}-${arch}.zip`,
              `Open-Voice-Input-macOS-${version}-${arch}.zip.blockmap`,
              `latest-${arch}-mac.yml`, `macOS-${arch}-SHA256SUMS.txt`
            ])
          ];
          const missing = expected.filter(name => !names.has(name));
          if (missing.length) throw new Error(`Release assets missing: ${missing.join(", ")}`);
          console.log(`Verified ${expected.length} desktop assets.`);
          NODE
      - name: Publish complete desktop release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
